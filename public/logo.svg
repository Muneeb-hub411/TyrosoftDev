<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Purple Gradients -->
    <linearGradient id="logo-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    
    <linearGradient id="logo-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    
    <linearGradient id="logo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>
    
    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Emblem Mark (Left side) -->
  <g transform="translate(10, 10)">
    <!-- Background Glow -->
    <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#logo-glow)" filter="url(#purple-glow)" />
    
    <!-- Outer Hex/Rounded Container -->
    <rect x="5" y="5" width="90" height="90" rx="24" fill="#0F0B16" stroke="url(#logo-grad-primary)" stroke-width="2.5" />

    <!-- Stylized Geometric T + Automation Circuit -->
    <!-- Top Bar of T -->
    <path d="M 25 32 C 25 28.686 27.686 26 31 26 L 69 26 C 72.314 26 75 28.686 75 32 L 75 38 C 75 41.314 72.314 44 69 44 L 56 44 L 56 74 C 56 77.314 53.314 80 50 80 L 50 80 C 46.686 80 44 77.314 44 74 L 44 44 L 31 44 C 27.686 44 25 41.314 25 38 Z" fill="url(#logo-grad-primary)" />
    
    <!-- Dynamic Accent Cuts/Tech Lines -->
    <path d="M 28 32 L 72 32" stroke="url(#logo-grad-light)" stroke-width="2" stroke-linecap="round" opacity="0.9" />
    <path d="M 50 44 L 50 72" stroke="url(#logo-grad-light)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    
    <!-- Tech Node Dots -->
    <circle cx="28" cy="32" r="3.5" fill="#EDEAF5" />
    <circle cx="72" cy="32" r="3.5" fill="#EDEAF5" />
    <circle cx="50" cy="72" r="3.5" fill="#A78BFA" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(120, 0)">
    <!-- TYROSOFT Text -->
    <text x="0" y="65" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="38" letter-spacing="0.5" fill="#EDEAF5">
      TYROSOFT
    </text>
    
    <!-- DEV Badge/Text -->
    <g transform="translate(242, 33)">
      <rect x="0" y="0" width="62" height="34" rx="8" fill="#15101F" stroke="#6D28D9" stroke-width="1.5" />
      <text x="31" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="1.5" fill="#A78BFA" text-anchor="middle">
        DEV
      </text>
    </g>

    <!-- Subtitle / Monospace Tagline -->
    <text x="2" y="88" font-family="monospace" font-size="11" letter-spacing="2.5" fill="#8C8799" opacity="0.9">
      SOFTWARE &amp; AI AUTOMATION
    </text>
  </g>
</svg>
